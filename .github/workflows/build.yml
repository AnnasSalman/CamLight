name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 build-tools;35.0.0'

      # Sign with the same debug key as the developer's PC, so APKs from CI and from the PC can update each other.
      - name: Use the project's debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            KS="$RUNNER_TEMP/debug.keystore"
            # tr removes any stray carriage returns or newlines that a Windows shell may have added to the secret
            echo "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$KS"
            echo "CAMLIGHT_DEBUG_KEYSTORE=$KS" >> "$GITHUB_ENV"
            echo "Using the provided debug keystore. Its certificate:"
            keytool -list -keystore "$KS" -storepass android | grep -E "androiddebugkey|SHA-256" -A1 | head -n 4
          else
            echo "::warning::No DEBUG_KEYSTORE_BASE64 secret. The APK is signed with a fresh debug key and cannot update an app signed with another key."
          fi

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Test summary
        if: always()
        run: python3 tools/test_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Signing certificate of the APK
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -n 1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep "SHA-256" | head -n 1 | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: camlight-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests
          retention-days: 7
          if-no-files-found: ignore
