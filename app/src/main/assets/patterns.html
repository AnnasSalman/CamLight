<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CamLight test screen</title>
<style>
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#101014; color:#b9b6c9; font:20px/1.5 system-ui, sans-serif; cursor:none; }
  #screen { position:fixed; inset:0; background:#101014; display:flex; align-items:center; justify-content:center; text-align:center; }
  #msg { max-width:70%; }
  #msg b { color:#e8e4ff; }
  #size { position:fixed; left:12px; bottom:10px; font-size:13px; opacity:.6; }
</style>
</head>
<body>
<div id="screen">
  <div id="msg">
    <p><b>CamLight test screen</b></p>
    <p id="line">Press <b>OK</b> (or click) once for full screen. Waiting for the phone…</p>
  </div>
</div>
<div id="size"></div>
<script>
(function () {
  const code = location.pathname.split('/').filter(Boolean)[1] || '';
  const screenEl = document.getElementById('screen'), msg = document.getElementById('msg'), line = document.getElementById('line'), sizeEl = document.getElementById('size');
  let lastOk = 0, shown = 'none';

  function goFull() {
    const el = document.documentElement;
    const f = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (f) { try { f.call(el); } catch (e) {} }
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
  }
  document.addEventListener('click', goFull);
  document.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') goFull(); });

  function hex(n) { return '#' + (n & 0xFFFFFF).toString(16).padStart(6, '0'); }

  function show(p) {
    if (!p || p.id === 'none') {
      msg.style.display = ''; screenEl.style.background = '#101014'; screenEl.style.boxShadow = 'none';
      shown = 'none'; return;
    }
    msg.style.display = 'none';
    screenEl.style.background = hex(p.rgb);
    // Edge markers: thin lines on the four extreme edges plus a center cross, to reveal cropping or scaling.
    screenEl.style.boxShadow = p.style === 'edges'
      ? 'inset 6px 0 0 #f00, inset 0 6px 0 #0f0, inset -6px 0 0 #00f, inset 0 -6px 0 #ff0'
      : 'none';
    shown = p.id;
  }

  function size() { return window.innerWidth + 'x' + window.innerHeight + (document.fullscreenElement || document.webkitFullscreenElement ? ' full screen' : ''); }

  function poll() {
    const fs = (document.fullscreenElement || document.webkitFullscreenElement) ? 1 : 0;
    const q = '?c=' + encodeURIComponent(code) + '&w=' + window.innerWidth + '&h=' + window.innerHeight + '&fs=' + fs +
      '&ua=' + encodeURIComponent(navigator.userAgent.slice(0, 100)) + '&t=' + Date.now();
    fetch('/pattern' + q).then(r => r.json()).then(p => {
      lastOk = Date.now(); show(p);
      if (shown === 'none') line.textContent = fs ? 'Connected. Waiting for the phone to start a pattern…' : 'Press OK (or click) once for full screen. Connected to the phone.';
      sizeEl.textContent = shown === 'none' ? size() : '';
    }).catch(() => {
      if (Date.now() - lastOk > 3000) { show(null); line.textContent = 'Lost contact with the phone. Is the camera screen still open?'; }
    }).finally(() => setTimeout(poll, 300));
  }
  poll();
})();
</script>
</body>
</html>
